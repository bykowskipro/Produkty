<!doctype html>

  <span class="badge">PLACEHOLDER – tu trafi treść dodatku (upsell)</span>

</main>

<script>Access.verify().then(function (v) { document.getElementById('status').textContent = v.ok ? 'aktywny' : 'brak'; });</script>
