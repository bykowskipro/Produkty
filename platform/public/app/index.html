<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Odhacz Auto</title>
  <meta name="description" content="Interaktywna checklista oględzin używanego auta – odhaczasz punkt po punkcie, wychodzisz z listą uwag do negocjacji.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B0F19">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Odhacz Auto">
  <link rel="manifest" href="/app/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="/assets/brand/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/brand/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="/assets/checklist/engine.css">
</head>
<body>
  <div id="app">
    <noscript><p style="padding:24px 16px;font:17px/1.5 system-ui">Odhacz Auto potrzebuje włączonego JavaScriptu. Włącz go w ustawieniach przeglądarki i odśwież stronę.</p></noscript>
  </div>
  <!-- access.js first: it strips ?t=<token> from the URL before analytics.js records the page view. -->
  <script src="/assets/access.js"></script>
  <script src="/assets/analytics.js"></script>
  <script src="/assets/checklist/engine.js"></script>
  <script>
    Checklist.mount({ root: '#app', content: '/app/content/auto.json', product: 'auto', kind: 'main', sw: '/app/sw.js', shopUrl: '/', mascot: '/assets/brand/hacz-latarka.svg' });
  </script>
</body>
</html>
