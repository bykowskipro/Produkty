<!doctype html><html lang="pl"><head><meta charset="utf-8">
<meta name="sizes" content="820x312,1640x624">
<!-- Cover strony na Facebooku (820×312 i 2× 1640×624). Wszystko w rem: 1rem = 1/82 szerokości, więc oba rozmiary wychodzą identycznie.
     Strefa bezpieczna (mobile 640×360 obcina boki): x ≈ 13–69 rem. -->
<style>
@font-face{font-family:"Space Grotesk";font-weight:700;src:url(../fonts/SpaceGrotesk-700.ttf) format("truetype")}
@font-face{font-family:Inter;font-weight:400;src:url(../fonts/Inter-400.ttf) format("truetype")}
@font-face{font-family:Inter;font-weight:600;src:url(../fonts/Inter-600.ttf) format("truetype")}
html{font-size:calc(100vw / 82)}
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:#0B0F19;color:#fff;font-family:Inter,system-ui,sans-serif}
.wm{position:absolute;left:14rem;top:6.6rem;width:19.5rem}
h1{position:absolute;left:13.9rem;top:12.2rem;margin:0;font:700 2.55rem/1.1 "Space Grotesk",Inter,sans-serif;letter-spacing:-.01em;color:#fff;white-space:nowrap}
h1 em{font-style:normal;color:#C6F135}
.sub{position:absolute;left:14rem;top:22.3rem;margin:0;font:400 1.3rem/1.3 Inter,sans-serif;color:#F1F5F9;opacity:.78;white-space:nowrap}
/* phone */
.phone{position:absolute;left:49.5rem;top:3.4rem;width:19.6rem;height:31rem;background:#fff;border-radius:2.6rem;box-shadow:0 0 0 .35rem #1E2433;padding:1.5rem 1.4rem;box-sizing:border-box;color:#0B0F19}
.notch{width:5rem;height:.5rem;border-radius:.3rem;background:#E2E8F0;margin:0 auto 1.1rem}
.stage{font:600 .82rem/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#6D28D9}
.title{font:700 1.35rem/1.15 "Space Grotesk",Inter,sans-serif;margin:.35rem 0 .7rem;display:flex;justify-content:space-between;align-items:baseline}
.title small{font:600 .95rem/1 Inter,sans-serif;color:#0B0F19;opacity:.55}
.bar{height:.55rem;border-radius:.3rem;background:#E2E8F0;overflow:hidden;margin-bottom:.9rem}
.bar i{display:block;height:100%;width:35%;background:#6D28D9;border-radius:.3rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.78rem 0;border-top:.1rem solid #E2E8F0;font:600 1.02rem/1.2 Inter,sans-serif}
.chip{flex:none;font:600 .82rem/1 Inter,sans-serif;padding:.42rem .65rem;border-radius:.7rem;color:#fff}
.ok{background:#16A34A}.warn{background:#F59E0B;color:#0B0F19}.bad{background:#DC2626}
.flags{margin-top:.5rem;display:flex;align-items:center;gap:.5rem;font:600 .9rem/1 Inter,sans-serif;color:#DC2626}
.flags b{display:inline-block;width:.75rem;height:.75rem;border-radius:50%;background:#DC2626}
.hacz{position:absolute;left:39.5rem;top:19.4rem;width:8.6rem;height:8.6rem}
.cap{position:absolute;left:36.8rem;top:28.4rem;width:14rem;text-align:center;font:600 .74rem/1 Inter,sans-serif;color:#F1F5F9;opacity:.62;white-space:nowrap}
</style></head><body>
<img class="wm" src="../../platform/public/assets/brand/wordmark-light.svg" alt="Odhacz">
<h1>Odhaczasz<br>punkt po punkcie.<br><em>Zero zgadywania.</em></h1>
<p class="sub">Odhacz Auto · 39 zł · bez instalacji</p>
<div class="phone">
  <div class="notch"></div>
  <div class="stage">Etap 3 z 7</div>
  <div class="title"><span>Nadwozie i lakier</span><small>6/17</small></div>
  <div class="bar"><i></i></div>
  <div class="row"><span>Lakier – maska</span><span class="chip ok">OK</span></div>
  <div class="row"><span>Szczeliny drzwi</span><span class="chip warn">Uwaga</span></div>
  <div class="row"><span>Spawy w komorze</span><span class="chip bad">Problem</span></div>
  <div class="flags"><b></b>Czerwone flagi: 1</div>
</div>
<img class="hacz" src="../../platform/public/assets/brand/hacz-kciuk.svg" alt="">
<div class="cap">Hacz · asystent AI</div>
</body></html>
